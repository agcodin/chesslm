[project]
name = "chesslm"
version = "0.1.0"
description = "A fine-tuned LLM that plays chess: LoRA on Apple Silicon, PUCT search with a learned value head, and a RAG coach"
readme = "README.md"
authors = [
    { name = "Aryan G", email = "aryangaur926@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "mlx-lm>=0.31.3",
    "python-chess>=1.999",
    "uvicorn>=0.53.0",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "adapters*", "models", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
